<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halaman tidak ditemukan · INAPR</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Halaman 404 statis (disajikan Vercel untuk rute yang tidak ada). Tidak memakai
      bundel Vite; warna disalin dari src/styles/tokens.css (Terang / Gelap).
    -->
    <script>
      ;(function () {
        var pref = null
        try {
          pref = localStorage.getItem('inapr-theme')
        } catch (e) {}
        if (pref === 'light' || pref === 'dark') document.documentElement.setAttribute('data-theme', pref)
      })()
    </script>
    <style>
      :root {
        --bg: #f1e9e4;
        --surface: #faf5f2;
        --ink: #250001;
        --accent: #a50104;
        --accent-ink: #ffffff;
        --muted: #6b4f50;
        --line: #d9cac4;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #250001;
          --surface: #310305;
          --ink: #f3f3f3;
          --accent: #fcba04;
          --accent-ink: #250001;
          --muted: #b8a3a4;
          --line: #590004;
        }
      }
      :root[data-theme='dark'] {
        --bg: #250001;
        --surface: #310305;
        --ink: #f3f3f3;
        --accent: #fcba04;
        --accent-ink: #250001;
        --muted: #b8a3a4;
        --line: #590004;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background: var(--bg);
        color: var(--ink);
        font-family: Montserrat, 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      .code {
        margin: 0;
        font-size: clamp(4rem, 18vw, 7rem);
        font-weight: 800;
        line-height: 1;
        color: var(--accent);
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.4rem;
        font-weight: 600;
      }
      p {
        margin: 0 0 0.25rem;
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        margin-top: 1.5rem;
        padding: 0.5rem 1.25rem;
        border: 2px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: transparent;
        color: var(--accent);
      }
      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Halaman tidak ditemukan</h1>
      <p>Alamat yang Anda buka tidak ada atau sudah dipindahkan.</p>
      <p lang="en">Page not found. The address does not exist or has moved.</p>
      <a href="/">Kembali ke beranda INAPR</a>
    </main>
  </body>
</html>
